<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERNETIC LOG // PROTOCOL 77-B</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Orbitron & Share Tech Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            cyan: '#00f0ff',
                            pink: '#ff007f',
                            yellow: '#ffe600',
                            purple: '#9d00ff',
                            dark: '#0a0a12',
                            panel: '#121220'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #06060c;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(20, 10, 35, 0.8) 0%, rgba(5, 5, 10, 0.95) 100%),
                linear-gradient(to right, rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 0, 127, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 3px, 6px 100%;
            z-index: 50;
        }

        .crt-screen {
            position: relative;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .crt-screen::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.6;
        }

        .neon-text-cyan {
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.8), 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .clip-corner {
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        }
        .clip-button {
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(10, 10, 20, 0.8);
            border-left: 1px solid rgba(0, 240, 255, 0.2);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #00f0ff;
            box-shadow: 0 0 8px #00f0ff;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #ff007f;
        }

        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
        .glitch-hover:hover {
            animation: glitch 0.2s ease infinite;
        }
    </style>
</head>
<body class="h-full flex flex-col items-center justify-center p-4 md:p-6 overflow-x-hidden selection:bg-cyber-pink selection:text-white">

    <div class="scanlines"></div>

    <!-- Local Audio Element (Change 'song.mp3' to match your file name) -->
    <audio id="bg-music" src="song.mp3" loop preload="auto"></audio>

    <div class="w-full max-w-4xl flex flex-col h-[90vh] max-h-[850px] relative z-10">
        
        <!-- Header Bar -->
        <header class="bg-cyber-dark border border-cyber-cyan/40 p-4 mb-4 flex flex-wrap justify-between items-center clip-corner bg-opacity-90 backdrop-blur-md relative">
            <div class="absolute top-0 left-0 w-2 h-2 border-t-2 border-l-2 border-cyber-cyan"></div>
            <div class="absolute bottom-0 right-0 w-2 h-2 border-b-2 border-r-2 border-cyber-cyan"></div>

            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 bg-cyber-pink rounded-full animate-ping"></div>
                <h1 class="font-orbitron font-extrabold text-xl md:text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyber-cyan via-white to-cyber-pink neon-text-cyan">
                    NEURAL_LINK // V3.09
                </h1>
            </div>

            <!-- Terminal Status & Optional Mute/Volume Toggle -->
            <div class="flex items-center space-x-4 mt-2 sm:mt-0 text-xs text-cyber-cyan/80">
                <div class="flex items-center space-x-2 bg-cyber-panel px-3 py-1 border border-cyber-cyan/30 rounded">
                    <span id="status-indicator" class="w-2 h-2 rounded-full bg-cyber-pink"></span>
                    <span id="status-text" class="font-mono tracking-wider">AWAITING_TRIGGER</span>
                </div>
                <!-- Audio Controller Widget -->
                <div class="flex items-center space-x-2 bg-cyber-panel/90 px-3 py-1 border border-cyber-cyan/40 rounded clip-corner">
                    <button id="audio-toggle" class="hover:text-cyber-pink text-cyber-cyan transition-colors px-1" title="Mute/Unmute Audio">
                        <i id="audio-icon" class="fas fa-volume-up"></i>
                    </button>
                    <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="0.5" class="w-16 h-1 bg-cyber-dark accent-cyber-pink cursor-pointer">
                </div>
            </div>
        </header>

        <!-- Main Display Panel -->
        <main class="flex-1 bg-cyber-dark/95 border-2 border-cyber-cyan/50 clip-corner p-4 md:p-6 flex flex-col justify-between crt-screen relative shadow-[0_0_30px_rgba(0,240,255,0.15)] overflow-hidden">
            
            <div class="flex justify-between items-center text-xs text-cyber-cyan/60 border-b border-cyber-cyan/20 pb-2 mb-3 relative z-10 font-mono">
                <div>[ CLASSIFIED DATA ENCRYPTION: AES-256 ]</div>
                <div id="page-indicator" class="text-cyber-pink">PHASE: 0 / 0</div>
            </div>

            <!-- 1. TRIGGER BUTTON CONTAINER -->
            <div id="trigger-container" class="flex-1 flex flex-col items-center justify-center relative z-10 transition-all duration-500">
                <div class="text-center mb-8 max-w-md">
                    <i class="fas fa-lock text-4xl text-cyber-pink/80 mb-4 animate-pulse"></i>
                    <h2 class="font-orbitron text-lg md:text-xl text-slate-300 font-semibold mb-2">ENCRYPTED MEMORY CORE ACCESS</h2>
                    <p class="text-xs text-slate-400">Authorization required to initialize decrypt sequence.</p>
                </div>

                <button id="btn-sorry" class="clip-button relative group bg-transparent border-2 border-cyber-pink hover:bg-cyber-pink/20 px-10 py-5 text-cyber-pink font-orbitron font-black text-xl tracking-widest transition-all duration-300 hover:scale-105 shadow-[0_0_20px_rgba(255,0,127,0.4)] glitch-hover">
                    <span class="relative z-10 flex items-center space-x-3">
                        <i class="fas fa-terminal"></i>
                        <span>I'M SORRY</span>
                    </span>
                    <span class="absolute top-0 left-0 w-2 h-2 bg-cyber-pink"></span>
                    <span class="absolute bottom-0 right-0 w-2 h-2 bg-cyber-pink"></span>
                </button>
            </div>

            <!-- 2. SCROLLABLE TEXTBOX CONTAINER -->
            <div id="textbox-container" class="hidden flex-1 flex-col h-full relative z-10 overflow-hidden">
                
                <div id="scroll-box" class="flex-1 overflow-y-auto custom-scrollbar bg-slate-950/80 border border-cyber-cyan/40 p-4 md:p-6 mb-4 rounded-sm relative text-slate-200 leading-relaxed font-mono text-sm md:text-base">
                    <div id="story-content" class="space-y-4"></div>

                    <div id="scrolling-badge" class="sticky bottom-2 left-full transform -translate-x-4 bg-cyber-cyan/20 border border-cyber-cyan text-cyber-cyan text-xs px-3 py-1 rounded inline-flex items-center space-x-2 backdrop-blur-sm shadow-md animate-bounce">
                        <i class="fas fa-arrow-down text-cyber-cyan"></i>
                        <span>AUTO SCROLLING...</span>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-2 border-t border-cyber-cyan/30">
                    <div class="w-full sm:w-1/2 flex flex-col space-y-1">
                        <div class="flex justify-between text-xs text-cyber-cyan/70 font-mono">
                            <span id="read-status">READING BUFFER...</span>
                            <span id="progress-text">0%</span>
                        </div>
                        <div class="w-full bg-slate-900 h-2 border border-cyber-cyan/30 rounded-full overflow-hidden">
                            <div id="progress-bar" class="bg-gradient-to-r from-cyber-cyan to-cyber-pink h-full w-0 transition-all duration-300 shadow-[0_0_10px_#00f0ff]"></div>
                        </div>
                    </div>

                    <button id="btn-continue" disabled class="w-full sm:w-auto clip-button bg-slate-900 border-2 border-slate-700 text-slate-500 font-orbitron font-bold px-8 py-3 tracking-wider transition-all duration-300 flex items-center justify-center space-x-2 cursor-not-allowed opacity-50">
                        <span>CONTINUE</span>
                        <i class="fas fa-chevron-right text-xs"></i>
                    </button>
                </div>
            </div>

        </main>

        <footer class="mt-4 text-center text-xs text-slate-500 font-mono flex justify-between items-center px-2">
            <div>SYSTEM: ONLINE</div>
            <div>[ ARCHIVE REF: #882-ALPHA ]</div>
            <div>STATUS: SECURE</div>
        </footer>
    </div>

    <script>
        // =========================================================================
        // YOUR CUSTOM TEXT CHUNKS
        // =========================================================================
        const STORY_CHUNKS = [
            `LOG ENTRY 01: Systems initializing...

TO CHLOE! 

I KNOW I HAVE ACTED LIKE A DICK THESE PAST FEW DAYS, WEEKS, EVEN MONTHS AND I KNOW I DON'T DESERVE ANYTHING GOOD NOR YOUR FORGIVENESS, IF I COULD TURN EVERYTHING BACK AND START FROM THE BEGINNING, I WOULD
BUT I CANNOT, SO I WILL START THIS WITH AN "I'M SORRY" AS I ALWAYS DO. I SEEM TO KEEP SAYING I'M SORRY AND MAKING THIS SAME MISTAKE AGAIN AND IT'S STUPID AND CHILDISH AND DUMB. HOWEVER THIS TIME ROUND
I AM DETERMINED TO NOT LET THIS GET IN BETWEEN US, I LOVE THE TIME WE SPEND GAMING, CHATTING, CRAZY BANTER, ALL THOSE MOMENTS HAVE BEEN AMAZING FOR ME. I HAVE HAD MANY REGRETS IN MY LIFE AND I AM DETERMINED NOT
TO MAKE THIS ONE OF THEM. SO FROM HERE ON OUT I SOLEMNLY SWEAR TO BELIEVE YOU AND I DO, BUT THIS STUPID STUPID OVERTHINKING GETS THE BETTER OF ME AND IT'S NOT FAIR OF ME TO PUT YOU THROUGH THIS AS WELL...
---Click Continue to proceed to section 2!---`,

            `LOG ENTRY 02: 

IT HURTS ME KNOWING THAT I HURT YOU, HOWEVER UNINTENTIONAL IT MAY SEEM, IT AFFECTS ME AS MUCH AS IT AFFECTS YOU. IT MAKES ME FEEL LIKE THE ONE PERSON I'M TRYING NOT TO BECOME AND THAT'S MY STEPDAD. HE TOO
IS A CONTROL FREAK AND HAS MOOD SWINGS, AND I DON'T LIKE WHAT I'M BECOMING BECAUSE I SEE HIM IN MYSELF. I SWEAR TO YOU THAT THIS TIME I WILL CHANGE THIS SHITTY BEHAVIOUR. IT BROKE ME WHEN YOU SAID THAT I HURT YOU
YESTERDAY. THIS WILL NOT HAPPEN AGAIN AND I WILL SWEAR THIS TO YOU UPON EVERY PERSON I HOLD DEAR TO MY LIFE. YOU HAVE CHANGED MY LIFE IN WAYS THAT I HAVEN'T THOUGHT POSSIBLE, FOR ONCE I CAN FEEL LIKE I ACTUALLY
MATTER TO SOMEONE...LIKE GENUINELY MATTER AND THE WAY YOU GET MAD AT ANY INJUSTICE THAT BEFALLS ME IS TOUCHING AND KNOWING THAT I'M DOING YOU AN INJUSTICE MAKES ME FEEL LIKE AN ABSOLUTE ASS.
---Click Continue for the end!---.`,

            `LOG ENTRY 03: Finalizing memory transfer... 

SO WITH THAT I SWEAR TO YOU THAT I WILL AND I AM DETERMINED TO NOT LET THIS DRIVE A RIFT BETWEEN US, I WILL FIX MYSELF BECAUSE YOU MATTER TO ME MUCH MORE THAN ANYTHING ELSE IN THE WORLD, AND I WANT YOU TO KNOW THAT.
I APPRECIATE EVERYTHING YOU HAVE DONE FOR ME, YOUR MERE PRESENCE REALLY DOES MAKE ME AN EXTREMELY HAPPY GUY AND I WILL FOCUS ON THIS FROM NOW ON AND NOT ON MY STUPID DUMBASSERY.
SO, THANK YOU FOR GIVING ME THIS ONE FINAL CHANCE, I PROMISE TO YOU THIS TIME THAT I WILL NOT SQUANDER IT.

WITH MUCH LOVE
KEV`
        ];

        const AUTO_SCROLL_SPEED = 0.9;

        // =========================================================================
        // APPLICATION ENGINE
        // =========================================================================
        let currentChunkIndex = 0;
        let isScrolling = false;
        let animationFrameId = null;

        const btnSorry = document.getElementById('btn-sorry');
        const btnContinue = document.getElementById('btn-continue');
        const triggerContainer = document.getElementById('trigger-container');
        const textboxContainer = document.getElementById('textbox-container');
        const scrollBox = document.getElementById('scroll-box');
        const storyContent = document.getElementById('story-content');
        const scrollingBadge = document.getElementById('scrolling-badge');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        const pageIndicator = document.getElementById('page-indicator');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const readStatus = document.getElementById('read-status');
        
        const bgMusic = document.getElementById('bg-music');
        const audioToggle = document.getElementById('audio-toggle');
        const audioIcon = document.getElementById('audio-icon');
        const volumeSlider = document.getElementById('volume-slider');

        // Audio controls
        audioToggle.addEventListener('click', () => {
            bgMusic.muted = !bgMusic.muted;
            audioIcon.className = bgMusic.muted ? "fas fa-volume-mute text-red-500" : "fas fa-volume-up text-cyber-cyan";
        });

        volumeSlider.addEventListener('input', (e) => {
            bgMusic.volume = parseFloat(e.target.value);
        });

        // Click "I'M SORRY" -> Plays audio and starts text scroll
        btnSorry.addEventListener('click', () => {
            bgMusic.play().catch(err => console.log("Audio play blocked by browser policy until interaction:", err));

            triggerContainer.classList.add('hidden');
            textboxContainer.classList.remove('hidden');
            textboxContainer.classList.add('flex');

            statusIndicator.className = "w-2 h-2 rounded-full bg-cyber-cyan animate-pulse";
            statusText.textContent = "DECRYPTING_DATASTREAM";

            renderChunk(currentChunkIndex);
        });

        btnContinue.addEventListener('click', () => {
            if (btnContinue.disabled) return;
            
            currentChunkIndex++;
            if (currentChunkIndex < STORY_CHUNKS.length) {
                setContinueButtonState(false);
                renderChunk(currentChunkIndex);
            } else {
                onStoryComplete();
            }
        });

        function renderChunk(index) {
            pageIndicator.textContent = `PHASE: ${index + 1} / ${STORY_CHUNKS.length}`;
            
            const paragraphEl = document.createElement('div');
            paragraphEl.className = "p-4 bg-cyber-dark/80 border-l-2 border-cyber-cyan mb-6 rounded-r text-slate-200 font-mono";
            
            const formattedText = STORY_CHUNKS[index].replace(/\n/g, '<br>');
            paragraphEl.innerHTML = `<span class="text-cyber-pink font-bold font-orbitron text-xs block mb-2">[ DATA_PACKET_0${index + 1} ]</span>${formattedText}`;

            storyContent.appendChild(paragraphEl);

            setTimeout(() => {
                startAutoScroll();
            }, 100);
        }

        function startAutoScroll() {
            stopAutoScroll();
            isScrolling = true;
            scrollingBadge.classList.remove('hidden');
            readStatus.textContent = "AUTO-SCROLLING DATA...";
            readStatus.className = "text-cyber-cyan font-mono animate-pulse";

            function scrollStep() {
                if (!isScrolling) return;

                const maxScroll = scrollBox.scrollHeight - scrollBox.clientHeight;
                
                if (maxScroll <= 0) {
                    updateProgress();
                    stopAutoScroll();
                    onReachedBottom();
                    return;
                }

                scrollBox.scrollTop += AUTO_SCROLL_SPEED;
                updateProgress();

                if (scrollBox.scrollTop >= maxScroll - 2) {
                    scrollBox.scrollTop = maxScroll;
                    updateProgress();
                    stopAutoScroll();
                    onReachedBottom();
                } else {
                    animationFrameId = requestAnimationFrame(scrollStep);
                }
            }

            animationFrameId = requestAnimationFrame(scrollStep);
        }

        function stopAutoScroll() {
            isScrolling = false;
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            scrollingBadge.classList.add('hidden');
        }

        function onReachedBottom() {
            readStatus.textContent = "PAUSED // END OF BUFFER";
            readStatus.className = "text-cyber-pink font-mono font-bold";
            setContinueButtonState(true);
        }

        function setContinueButtonState(enabled) {
            if (enabled) {
                btnContinue.disabled = false;
                btnContinue.className = "w-full sm:w-auto clip-button bg-cyber-pink hover:bg-cyber-pink/80 border-2 border-cyber-pink text-white font-orbitron font-bold px-8 py-3 tracking-wider transition-all duration-300 flex items-center justify-center space-x-2 shadow-[0_0_15px_rgba(255,0,127,0.6)] cursor-pointer glitch-hover";
                btnContinue.querySelector('span').textContent = (currentChunkIndex + 1 < STORY_CHUNKS.length) ? "CONTINUE READ" : "FINALIZE LOG";
            } else {
                btnContinue.disabled = true;
                btnContinue.className = "w-full sm:w-auto clip-button bg-slate-900 border-2 border-slate-700 text-slate-500 font-orbitron font-bold px-8 py-3 tracking-wider transition-all duration-300 flex items-center justify-center space-x-2 cursor-not-allowed opacity-50";
            }
        }

        function updateProgress() {
            const maxScroll = scrollBox.scrollHeight - scrollBox.clientHeight;
            if (maxScroll <= 0) {
                progressBar.style.width = '100%';
                progressText.textContent = '100%';
                return;
            }
            const percentage = Math.min(100, Math.round((scrollBox.scrollTop / maxScroll) * 100));
            progressBar.style.width = `${percentage}%`;
            progressText.textContent = `${percentage}%`;
        }

        function onStoryComplete() {
            stopAutoScroll();
            
            const endBlock = document.createElement('div');
            endBlock.className = "p-6 bg-cyber-pink/10 border-2 border-cyber-pink text-center my-6 rounded text-cyber-pink font-orbitron animate-pulse";
            endBlock.innerHTML = `
                <i class="fas fa-check-circle text-3xl mb-2"></i>
                <h3 class="text-lg font-bold">ALL NEURAL LOGS UNLOCKED</h3>
                <p class="text-xs text-slate-300 mt-1 font-mono">CONNECTION TERMINATED BY REMOTE HOST.</p>
            `;
            storyContent.appendChild(endBlock);

            scrollBox.scrollTop = scrollBox.scrollHeight;

            btnContinue.disabled = true;
            btnContinue.className = "w-full sm:w-auto clip-button bg-slate-900 border border-slate-800 text-slate-600 font-orbitron font-bold px-8 py-3 cursor-not-allowed";
            btnContinue.querySelector('span').textContent = "LOG COMPLETED";

            statusIndicator.className = "w-2 h-2 rounded-full bg-green-400";
            statusText.textContent = "TRANSMISSION_COMPLETE";
            statusText.className = "font-mono tracking-wider text-green-400";
            readStatus.textContent = "SESSION TERMINATED";
        }

        scrollBox.addEventListener('wheel', () => {
            if (isScrolling) stopAutoScroll();
        });
        scrollBox.addEventListener('touchmove', () => {
            if (isScrolling) stopAutoScroll();
        });
    </script>
</body>
</html>
